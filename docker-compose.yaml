services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    container_name: vllm-qwen3
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./models/Qwen3-4B-Instruct-2507-FP8:/model:ro
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - qwen-4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
  asr:
    image: vllm/vllm-openai:v0.32.0
    container_name: vllm-qwen3-asr
    profiles: ["asr"]
    ports:
      - "2043:8000"
    volumes:
      - ./models/Qwen3-ASR-1.7B:/model:ro
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - qwen3-asr
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8096"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.90"
      - --limit-mm-per-prompt
      - '{"audio": 1}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu